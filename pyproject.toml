[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-verify"
version = "0.1.0a1"
description = "Verification scheduling under freshness decay: which claim to check next when beliefs age, feed evidence is free and verification is not. Simulation only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashutosh Gandhi" }]
keywords = ["value-of-information", "scheduling", "verification", "bayesian", "attack-surface", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/gandhiashutosh14/sentinel-verify"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
